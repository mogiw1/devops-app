name: DevOps App CI/CD

on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/mogiw1/devops-app:latest .

      - name: Push Docker image
        run: docker push ghcr.io/mogiw1/devops-app:latest
